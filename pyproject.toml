[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-decoder-runtime"
version = "0.1.0"
description = "A small PyTorch decoder-only LLM runtime baseline"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
hf = ["transformers>=4.32"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_runtime*"]
